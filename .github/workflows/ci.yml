name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile core scripts
        run: |
          python -m py_compile src/collect_data.py
          python -m py_compile src/validate_data.py
          python -m py_compile src/load_processed_data.py
          python -m py_compile src/coverage_report.py
          python -m py_compile src/generate_report.py
          python -m py_compile src/dashboard.py
          python -m py_compile src/run_pipeline.py
          python -m py_compile src/alerts.py
          python -m py_compile src/reference_data/b3_calendar.py
          python -m py_compile src/collectors/cvm_funds.py
          python -m py_compile src/collectors/anbima_client.py
          python -m py_compile src/collectors/anbima_prices.py
          python -m py_compile collect_data.py
          python -m py_compile run_pipeline.py
          python -m py_compile src/metadata/manifest.py
          python -m py_compile src/metadata/dataset_versioning.py
          python -m py_compile src/metadata/audit.py
          python -m py_compile src/validation/reconciliation.py
          python -m py_compile src/storage/database.py
          python -m py_compile src/source_availability.py
          python -m py_compile src/artifact_retention.py

      - name: Prepare database for monitoring tests
        run: |
          # CI is deterministic: use the versioned raw fixtures and do not depend
          # on a live BCB/Yahoo response. Live collection is covered by the
          # Daily pipeline operations workflow.
          python run_pipeline.py --skip-collection --enable-manifest --reconcile

      - name: Run offline tests
        run: |
          python tests/test_module_05_monitoring.py
          python tests/test_module_06_operational_maturity.py
          python tests/test_module_07_financial_analytics.py
          python tests/test_module_08_data_coverage.py
          python tests/test_module_09_institutional_sources.py
          python tests/test_module_10_traceability_reconciliation_versioning.py
          python tests/test_module_11_source_availability.py
          python tests/test_module_12_artifact_retention.py
