name: Docker validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose syntax
        run: docker compose config -q

      - name: Build application image
        run: docker compose build --pull

      - name: Start PostgreSQL, API and dashboard
        run: docker compose up -d

      - name: Wait for API health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api postgres dashboard
          exit 1

      - name: Verify services and dashboard startup
        run: |
          docker compose ps
          docker compose ps --status running | grep -q "brazilian_financial_pipeline_postgres"
          docker compose ps --status running | grep -q "brazilian_financial_pipeline_api"
          docker compose ps --status running | grep -q "brazilian_financial_pipeline_dashboard"
          if docker compose logs --no-color dashboard | grep -Eiq "(traceback|importerror|modulenotfounderror|error:)"; then
            echo "Dashboard startup log contains an import/runtime error."
            docker compose logs --no-color dashboard
            exit 1
          fi

      - name: Stop services and remove volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
