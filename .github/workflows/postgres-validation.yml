name: PostgreSQL validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres-validation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: financial_pipeline
          POSTGRES_USER: pipeline_user
          POSTGRES_PASSWORD: pipeline_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline_user -d financial_pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pipeline_user:pipeline_pass@localhost:5432/financial_pipeline
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect 2024 data
        run: |
          for attempt in 1 2 3; do
            echo "BCB collection attempt ${attempt}/3"
            if python ./collect_data.py --start-date 2024-01-01 --end-date 2024-12-31 && python - <<'PY'
          import sys
          from pathlib import Path
          import pandas as pd

          ipca_file = Path("data/raw/bcb/ipca_monthly.csv")
          if not ipca_file.exists():
              print(f"Missing expected file: {ipca_file}")
              sys.exit(1)
          rows = len(pd.read_csv(ipca_file))
          print(f"ipca_monthly rows: {rows}")
          if rows == 0:
              sys.exit(1)
          PY
            then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "BCB collection did not produce historical IPCA data after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Run pipeline with PostgreSQL backend
        run: python ./run_pipeline.py --skip-collection --database-backend postgres --enable-manifest --reconcile

      - name: Assert PostgreSQL row counts
        run: |
          python - <<'PY'
          import os
          import psycopg2

          expected = {
              "fact_bcb_series": 771,
              "fact_b3_stock_prices": 1004,
          }

          with psycopg2.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  for table_name, expected_count in expected.items():
                      cur.execute(f"SELECT COUNT(*) FROM {table_name}")
                      actual_count = cur.fetchone()[0]
                      print(f"{table_name}: {actual_count}")
                      if actual_count != expected_count:
                          raise SystemExit(
                              f"{table_name}: expected {expected_count}, got {actual_count}"
                          )
          PY

      - name: Run tests
        run: python -m pytest -q
